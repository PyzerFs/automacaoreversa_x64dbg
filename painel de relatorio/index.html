<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Laboratório RE Avançado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Automação Integrada Engenharia Reversa</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Hash do Executável</th>
                    <th>Arquivos</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ item.hash }}</td>
                    <td>{{ item.count }}</td>
                    <td>
                        <a href="{{ url_for('view_dump', file_hash=item.hash) }}"
                            class="btn btn-sm btn-info">Visualizar</a>
                        <a href="{{ url_for('report', file_hash=item.hash) }}" class="btn btn-sm btn-warning">Gerar
                            Relatório</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
